<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usynlige naboer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(180deg, #e8f4f8 0%, #b8dfe8 40%, #a0c9d9 60%, #8fb5cc 100%);
            position: relative;
        }

        /* Winter landscape background elements */
        .mountain-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><defs><linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%25" style="stop-color:%23f5f5f0;stop-opacity:1" /><stop offset="100%25" style="stop-color:%23e0e0d8;stop-opacity:1" /></linearGradient></defs><polygon points="0,400 200,200 400,300 600,100 800,250 1000,150 1200,300 1200,600 0,600" fill="%23e8f1f5" /><polygon points="0,450 150,300 350,380 550,250 750,350 950,280 1200,400 1200,600 0,600" fill="%23d4e4ed" /><polygon points="0,500 100,400 300,480 500,350 700,450 900,380 1200,500 1200,600 0,600" fill="%23c0d8e8" /></svg>') no-repeat bottom;
            background-size: cover;
            z-index: 1;
        }

        /* Snowflakes effect */
        .snowflake {
            position: fixed;
            top: 0;
            color: white;
            font-size: 1em;
            opacity: 0.8;
            z-index: 0;
            animation: snowfall linear infinite;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes snowfall {
            to {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .header-logo {
            height: 60px;
            width: auto;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #1a4d6d;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.7);
        }

        .header p {
            font-size: 1.1em;
            color: #2a5a7d;
            opacity: 0.9;
        }

        /* Chat window */
        .chat-box {
            max-width: 800px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #4a9fd8 0%, #2a7fc9 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-label {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .message.user .message-label {
            color: #2a7fc9;
        }

        /* Input area */
        .input-area {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: #f9f9f9;
        }

        #question {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #d0d0d0;
            border-radius: 25px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #question:focus {
            outline: none;
            border-color: #4a9fd8;
            box-shadow: 0 0 8px rgba(74, 159, 216, 0.3);
        }

        #send-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #4a9fd8 0%, #2a7fc9 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(74, 159, 216, 0.3);
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 159, 216, 0.4);
        }

        #send-btn:active {
            transform: translateY(0);
        }

        #send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4a9fd8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Error message */
        .error-message {
            color: #d32f2f;
            font-size: 0.9em;
            padding: 10px 16px;
            background: #ffebee;
            border-radius: 8px;
            margin: 10px 0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .chat-box {
                max-width: 100%;
                height: 400px;
            }

            .message-content {
                max-width: 85%;
            }

            .container {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Snowflakes -->
    <div id="snowflakes"></div>

    <!-- Mountain background -->
    <div class="mountain-bg"></div>

    <!-- Main container -->
    <div class="container">
        <div class="header">
            <img src="/static/images/Usynlige naboer logo.png" alt="Logo" class="header-logo">
            <div>
                <h1>❄️ Norsk landskap</h1>
                <p>Spør agenten vår Hubro om truede eller fremmede arter i Norge</p>
            </div>
        </div>

        <div class="chat-box">
            <div class="messages" id="messages">
                <div class="message agent">
                    <div>
                        <div class="message-label">Agent</div>
                        <div class="message-content">
                            Hei! 👋 Jeg er klar til å svare på spørsmål om dataene dine. Hva vil du vite?
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input 
                    type="text" 
                    id="question" 
                    placeholder="Ask me anything about the data... (e.g., 'Show me the data summary')"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById("messages");
        const questionInput = document.getElementById("question");
        const sendBtn = document.getElementById("send-btn");

        // Create snowflakes
        function createSnowflake() {
            const snowflake = document.createElement("div");
            snowflake.classList.add("snowflake");
            snowflake.innerHTML = "❄";
            snowflake.style.left = Math.random() * window.innerWidth + "px";
            snowflake.style.animationDuration = (Math.random() * 10 + 10) + "s";
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            snowflake.style.fontSize = (Math.random() * 10 + 10) + "px";
            document.getElementById("snowflakes").appendChild(snowflake);

            setTimeout(() => snowflake.remove(), 20000);
        }

        // Create snowflakes periodically
        setInterval(createSnowflake, 500);

        // Send message
        async function sendMessage() {
            const question = questionInput.value.trim();
            if (!question) return;

            // Disable button and clear input
            sendBtn.disabled = true;
            questionInput.disabled = true;

            // Add user message
            addMessage("You", question, true);
            questionInput.value = "";

            try {
                // Show loading indicator
                const loadingDiv = addMessage("Agent", '<span class="spinner"></span>Thinking...', false);

                // Send request to backend
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                // Remove loading indicator
                loadingDiv.remove();

                if (response.ok) {
                    addMessage("Agent", data.answer, false);
                } else {
                    addMessage("Agent", `<span class="error-message">Error: ${data.error}</span>`, false);
                }
            } catch (error) {
                addMessage("Agent", `<span class="error-message">Network error: ${error.message}</span>`, false);
            } finally {
                sendBtn.disabled = false;
                questionInput.disabled = false;
                questionInput.focus();
            }
        }

        // Add message to chat
        function addMessage(sender, text, isUser) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("message", isUser ? "user" : "agent");

            const contentDiv = document.createElement("div");
            contentDiv.innerHTML = `
                <div class="message-label">${sender}</div>
                <div class="message-content">${text}</div>
            `;
            messageDiv.appendChild(contentDiv);
            messagesDiv.appendChild(messageDiv);

            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            return messageDiv;
        }

        // Event listeners
        sendBtn.addEventListener("click", sendMessage);
        questionInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        // Focus on input
        questionInput.focus();
    </script>
</body>
</html>
